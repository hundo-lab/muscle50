[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "muscle50"
version = "0.1.0"
description = "Local-first personal fitness data tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect==0.3.15",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
]

[project.scripts]
muscle50 = "muscle50.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/muscle50"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["muscle50"]

[[tool.mypy.overrides]]
module = ["garminconnect", "garminconnect.*"]
ignore_missing_imports = true
